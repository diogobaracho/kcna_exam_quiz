services:
  # Development server with hot reload: http://localhost:5173
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  # Production-style static build served by nginx: http://localhost:8080
  prod:
    build:
      context: .
      target: prod
    ports:
      - "8080:80"

  # One-shot test runner: docker compose run --rm test
  test:
    build:
      context: .
      target: dev
    command: npm run test:run
    profiles:
      - test
